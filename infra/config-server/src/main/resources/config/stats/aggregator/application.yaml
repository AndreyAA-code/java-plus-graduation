spring:
  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: true

kafka:
  bootstrap:
    servers: localhost:9092
  consumer:
    group: stats.aggregator.action
    poll:
      timeout: 100
  topics:
    stats-user-action-v1: stats.user-actions.v1
    stats-events-similarity-v1: stats.events-similarity.v1

grpc:
  server:
    port: 0

logging:
  level:
    ru.practicum: DEBUG

server:
  port: 0