services:
  stats-db:
    image: postgres:16.1
    container_name: stats-postgres
    ports:
      - "6541:5432"
    environment:
      POSTGRES_PASSWORD: stats
      POSTGRES_USER: stats
      POSTGRES_DB: stats
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "stats", "-U", "stats"]
      interval: 10s
      timeout: 5s
      retries: 20

  ewm-db:
    image: postgres:16.1
    container_name: ewm-postgres
    ports:
      - "6542:5432"
    environment:
      POSTGRES_PASSWORD: ewm
      POSTGRES_USER: ewm
      POSTGRES_DB: ewm

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/user-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-user-service-schema.sql

    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "ewm", "-U", "ewm"]
      interval: 10s
      timeout: 6s
      retries: 20