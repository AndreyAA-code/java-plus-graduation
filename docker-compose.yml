

services:
  stats-db:
    image: postgres:16.1
    container_name: stats-postgres
    ports:
      - "6541:5432"
    environment:
      POSTGRES_PASSWORD: stats
      POSTGRES_USER: stats
      POSTGRES_DB: stats
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "stats", "-U", "stats"]
      interval: 10s
      timeout: 5s
      retries: 20

  stats-server:
    build: stats/stats-server
    image: stats/stats-server
    container_name: stats-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: stats
      SPRING_DATASOURCE_PASSWORD: stats

  ewm-db:
    image: postgres:16.1
    container_name: ewm-postgres
    ports:
      - "6542:5432"
    environment:
      POSTGRES_PASSWORD: ewm
      POSTGRES_USER: ewm
      POSTGRES_DB: ewm
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "ewm", "-U", "ewm"]
      interval: 10s
      timeout: 6s
      retries: 20

  ewm-service:
    build: main-service
    container_name: main-service
    ports:
      - "8080:8080"
    depends_on:
      ewm-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
      SERVER_URL: http://stats-server:9090
