syntax = "proto3";

package stats.service.dashboard;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";

import "stats/messages/InteractionsCountRequest.proto";
import "stats/messages/RecommendedEvent.proto";
import "stats/messages/SimilarEventsRequest.proto";
import "stats/messages/UserPredictionsRequest.proto";

service RecommendationsController {
  rpc GetRecommendationsForUser (stats.messages.action.UserPredictionsRequestProto)
      returns (stream stats.messages.action.RecommendedEventProto);

  rpc GetSimilarEvents (stats.messages.action.SimilarEventsRequestProto)
      returns (stream stats.messages.action.RecommendedEventProto);

  rpc GetInteractionsCount (stats.messages.action.InteractionsCountRequestProto)
      returns (stream stats.messages.action.RecommendedEventProto);
}